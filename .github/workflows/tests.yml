name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest
    # الوظيفة كاملة تنتهي عادةً في ثلاث دقائق. عُلِّقت خطوة الاختبارات مرتين على عدّاء
    # GitHub (التشغيل 98، والمحاولة الأولى من 99) على كود مرّ أخضر قبلها وبعدها،
    # فبلا مهلة تبقى الوظيفة معلَّقة حتى الحد الافتراضي (ست ساعات) وتحرق الحصة.
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Sources.sln

      - name: Build Solution
        run: dotnet build Sources.sln --configuration Release --no-restore

      - name: Run Unit Tests
        timeout-minutes: 10
        run: dotnet test Sources.Tests/Sources.Tests.csproj --configuration Release --no-build --logger "console;verbosity=detailed"
